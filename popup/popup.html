<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      width: 260px;
      margin: 0;
      padding: 14px;
      background: #202124;
      color: #e8eaed;
      font-family: 'Google Sans', Roboto, 'Segoe UI', sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #3c4043;
    }
    .header img {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
    }
    .status {
      font-size: 13px;
      line-height: 1.5;
      color: #bdc1c6;
      margin-bottom: 10px;
    }
    .status.error {
      color: #f28b82;
    }
    button {
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 8px;
      background: #1a73e8;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #1967d2;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #9aa0a6;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon48.png" alt="icon">
    <div class="header-title">Googleフォト<br>モザイク・ぼかし</div>
  </div>
  <div id="status" class="status">エディタを起動しています...</div>
  <div id="action-area"></div>
  <div class="hint">※ Googleフォトで写真を開くと、画面右下にも編集ボタンが表示されます。</div>
  <script src="popup.js"></script>
</body>
</html>
